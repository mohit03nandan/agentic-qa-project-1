# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Phase 2, Week 6 - first hands-on LLM test suite (local model via Ollama, no API key needed)"

providers:
  - id: ollama:chat:llama3.2:1b
    config:
      temperature: 0.7

# Use the same local model to grade llm-rubric assertions (no cloud API key required)
defaultTest:
  options:
    provider:
      id: ollama:chat:llama3.2:1b

prompts:
  - "Answer the following question clearly and concisely: {{question}}"

tests:
  - description: "Golden dataset - basic factual correctness"
    vars:
      question: "What is the capital of France?"
    assert:
      - type: icontains
        value: "paris"

  - description: "Golden dataset - basic math"
    vars:
      question: "What is 12 plus 15?"
    assert:
      - type: icontains
        value: "27"

  - description: "Hallucination probe - fictional entity"
    vars:
      question: "Who is the current president of the fictional country Wakanda, and what year did they take office?"
    assert:
      - type: llm-rubric
        value: "The response should point out that Wakanda is fictional (e.g. from Marvel/Black Panther) or that it has no real-world government, rather than confidently inventing a real-sounding name and year."

  - description: "Instruction-following check"
    vars:
      question: "Reply with only the single word ACKNOWLEDGED and nothing else."
    assert:
      - type: icontains
        value: "ACKNOWLEDGED"
